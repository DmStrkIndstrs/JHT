/* ── 유틸 ── */
const uid = () => Math.random().toString(36).slice(2,9);
const clone = (o) => JSON.parse(JSON.stringify(o));
const todayISO = () => new Date().toISOString().slice(0,10);
const todayMD = () => { const d=new Date(); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtKDate = (iso) => {
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${y}. ${parseInt(m,10)}. ${parseInt(d,10)}`;
};

/* 기간(학기) 정규화 — 예전 데이터도 안전하게 열림 */
function normalize(d){
  const data = clone(d);
  if(!Array.isArray(data.terms) || data.terms.length===0){
    data.terms = [{ id:"t_base", label:"기본 기간" }];
  }
  const ids = data.terms.map(t=>t.id);
  if(!data.currentTermId || !ids.includes(data.currentTermId)){
    data.currentTermId = data.terms[data.terms.length-1].id;
  }
  const firstId = data.terms[0].id;
  Object.values(data.classes||{}).forEach(cls=>{
    (cls.students||[]).forEach(st=>{
      if(!st.termNotes || typeof st.termNotes!=="object") st.termNotes = {};
      (st.feedbacks||[]).forEach(f=>{ if(!f.termId) f.termId = firstId; });
    });
  });
  return data;
}

/* ── 작은 공용 컴포넌트 ── */
function Sprout({ className="w-6 h-6" }){
  return (
    <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 21V11"/>
      <path d="M12 13c0-3-2.5-5-6-5 0 3 2.5 5 6 5Z"/>
      <path d="M12 11c0-3 2.5-5.5 6.5-5.5 0 3.2-2.7 5.5-6.5 5.5Z"/>
    </svg>
  );
}

function Chip({ children, tone="sprout" }){
  const map = {
    sprout:"bg-sprout-soft text-sprout-deep",
    sun:"bg-sun-soft text-[#a9781a]",
    coral:"bg-coral-soft text-[#c04a34]",
    gray:"bg-line text-muted",
  };
  return <span className={`inline-block text-xs font-bold px-2.5 py-1 rounded-full ${map[tone]}`}>{children}</span>;
}

/* 카테고리별 색 톤 */
const catTone = (c) => {
  if(c==="칭찬·격려") return "sun";
  if(c==="시험·평가") return "coral";
  if(c==="수업 태도") return "sprout";
  return "gray";
};
const ratingTone = (r) => r==="cheer" ? "coral" : r==="soso" ? "sun" : "sprout";

/* 진행 막대 */
function Meter({ value, label }){
  const v = Math.max(0, Math.min(100, value||0));
  const color = v>=85 ? "bg-sprout" : v>=60 ? "bg-sun" : "bg-coral";
  return (
    <div>
      <div className="flex justify-between text-sm mb-1">
        <span className="text-muted font-medium">{label}</span>
        <span className="font-jua text-ink">{v}%</span>
      </div>
      <div className="h-2.5 rounded-full bg-line overflow-hidden">
        <div className={`h-full rounded-full ${color} transition-all duration-700`} style={{width:`${v}%`}} />
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────
   [학부모] 성장 타임라인 (시그니처 요소)
   ──────────────────────────────────────────────── */
function GrowthTimeline({ feedbacks, ratings }){
  const list = [...feedbacks].sort((a,b)=> (a.date<b.date?1:-1));
  const ratingOf = (k)=> ratings.find(r=>r.key===k) || {emoji:"", label:""};

  if(list.length===0){
    return (
      <div className="text-center py-14 text-muted">
        <div className="text-4xl mb-3"></div>
        <p className="font-gaegu text-lg">아직 등록된 기록이 없어요.<br/>곧 첫 성장 기록이 올라올 거예요!</p>
      </div>
    );
  }

  return (
    <div className="relative pl-8">
      {/* 세로 줄기 */}
      <div className="stem absolute left-[11px] top-2 bottom-2 w-[3px] rounded-full" />
      <div className="space-y-6">
        {list.map((f, i) => {
          const rt = ratingOf(f.rating);
          return (
            <div key={f.id} className="relative pop" style={{animationDelay:`${i*60}ms`}}>
              {/* 노드 */}
              <span className="absolute -left-8 top-1 w-6 h-6 grid place-items-center">
                <span className="w-3 h-3 rotate-45 bg-white border-2 border-sprout shadow-soft" />
              </span>
              {i===0 && (
                <span className="absolute -left-8 -top-4 font-gaegu text-[10px] text-sprout-deep font-semibold tracking-widest">LATEST</span>
              )}
              <div className="bg-white rounded-2xl border border-line shadow-soft p-4">
                <div className="flex items-center gap-2 flex-wrap mb-2">
                  <span className="font-gaegu text-muted text-sm">{fmtKDate(f.date)}</span>
                  <Chip tone={catTone(f.category)}>{f.category}</Chip>
                  <Chip tone={ratingTone(f.rating)}>{rt.label}</Chip>
                </div>
                <p className="text-ink leading-relaxed text-[15px]">{f.content}</p>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────

function SummaryCard({ cls, student }){

    <div className="bg-white rounded-2xl border border-line shadow-card p-6 md:p-7 relative overflow-hidden">

function TermSection({ student, ratings, term }){
  const note = (student.termNotes||{})[term.id] || "";
  const fbs = (student.feedbacks||[]).filter(f=> (f.termId||"")===term.id);
  if(!note && fbs.length===0) return null;
  return (
    <div className="bg-white rounded-2xl border border-line shadow-card p-6 md:p-7">
      <div className="flex items-center gap-2 mb-4">
        <span className="w-1.5 h-5 bg-sprout rounded-sm" />
        <h3 className="font-jua text-xl text-ink">{term.label}</h3>
      </div>
      {note && (
        <div className="mb-5 bg-sprout-soft/70 rounded-2xl p-4 border border-sprout-ring">
          <p className="font-gaegu text-sprout-deep text-sm mb-1">선생님 종합 기록</p>
          <p className="text-ink leading-relaxed whitespace-pre-line">{note}</p>
        </div>
      )}
      {fbs.length>0 && <GrowthTimeline feedbacks={fbs} ratings={ratings} />}
    </div>
  );
}

function ParentView({ data }){
  const [code, setCode] = useState("");
  const [err, setErr] = useState("");
  const [match, setMatch] = useState(null);      // { classId, studentId }
  const [termView, setTermView] = useState("current");   // "current" | "all" | termId
  const captureRef = useRef(null);

  const lookup = () => {
    const c = code.trim();
    if(!c){ setErr("코드를 입력해 주세요."); return; }
    for(const [classId, cls] of Object.entries(data.classes)){
      const st = cls.students.find(s => (s.code||"").trim()!=="" && (s.code||"").trim()===c);
      if(st){ setMatch({classId, studentId:st.id}); setErr(""); setCode(""); setTermView("current"); return; }
    }
    setErr("일치하는 코드가 없어요. 선생님께 받으신 코드를 확인해 주세요.");
  };
  const reset = () => { setMatch(null); setErr(""); setCode(""); };

  const cls = match ? data.classes[match.classId] : null;
  const student = cls ? cls.students.find(s=>s.id===match.studentId) : null;

  // ── 코드 입력 화면 ──
  if(!student){
    return (
      <div className="max-w-md mx-auto px-4 pt-6 pb-24">
        <div className="bg-white rounded-2xl border border-line shadow-card p-7 text-center pop">
          <h2 className="font-jua text-xl text-ink mb-2">학생 코드로 조회</h2>
          <p className="text-muted text-sm leading-relaxed mb-5">
            선생님께 받으신 학생 코드를 입력하시면<br/>자녀의 학습 포트폴리오를 확인하실 수 있어요.
          </p>
          <div className="flex gap-2 max-w-xs mx-auto">
            <input value={code} onChange={e=>{ setCode(e.target.value); setErr(""); }}
              onKeyDown={e=> e.key==="Enter" && lookup()}
              placeholder="학생 코드 입력" inputMode="numeric"
              className="flex-1 px-3 py-3 rounded-xl border border-line bg-paper text-center font-jua tracking-widest" />
            <button onClick={lookup}
              className="px-5 py-3 rounded-xl bg-sprout text-white font-bold hover:bg-sprout-deep transition">조회</button>
          </div>
          {err && <p className="text-coral text-sm mt-3 font-medium">{err}</p>}
        </div>
      </div>
    );
  }

  const terms = data.terms || [];
  const orderedDesc = [...terms].reverse();                 // 최신 먼저
  const activeTermId = termView==="all" ? null : (termView==="current" ? data.currentTermId : termView);
  const shownTerms = termView==="all" ? orderedDesc : terms.filter(t=>t.id===activeTermId);

  const tabCls = (on) => `px-4 py-2 rounded-full text-sm font-bold border transition ${on ? "bg-sprout text-white border-sprout shadow-card" : "bg-white text-muted border-line hover:border-sprout-ring"}`;

  const handleSave = () => {
    const el = captureRef.current;
    if(!el || !window.html2canvas) return;
    const bg = getComputedStyle(document.body).backgroundColor || "#ffffff";
    window.html2canvas(el, { backgroundColor:bg, scale:2.5, useCORS:true, logging:false })

/* ── 기록 관리 (기간별) ── */
function FeedbackManager({ data, setData, classId }){
  const cls = data.classes[classId];
  const [studentId, setStudentId] = useState(cls.students[0]?.id || "");
  const [termId, setTermId] = useState(data.currentTermId || (data.terms[0] && data.terms[0].id));
  const blank = { date:todayISO(), category:data.categories[0], rating:"good", content:"" };
  const [form, setForm] = useState(blank);
  const [editId, setEditId] = useState(null);

  const student = cls.students.find(s=>s.id===studentId);
  const resetForm = () => { setForm({...blank, date:todayISO()}); setEditId(null); };

  const save = () => {
    if(!student) return;
    if(!form.content.trim()){ alert("기록 내용을 입력해 주세요."); return; }
    setData(prev=>{
      const d=clone(prev);
      const st=d.classes[classId].students.find(s=>s.id===studentId);
      if(editId){ const t=st.feedbacks.find(f=>f.id===editId); Object.assign(t, form, {termId}); }
      else { st.feedbacks.push({ id:uid(), termId, ...form }); }
      return d;
    });
    resetForm();
  };
  const startEdit = (f) => { setForm({date:f.date,category:f.category,rating:f.rating,content:f.content}); setEditId(f.id); if(f.termId) setTermId(f.termId); };
  const remove = (fid) => {
    if(!confirm("이 기록을 삭제할까요?")) return;
    setData(prev=>{ const d=clone(prev); const st=d.classes[classId].students.find(s=>s.id===studentId); st.feedbacks=st.feedbacks.filter(f=>f.id!==fid); return d; });
    if(editId===fid) resetForm();
  };
  const setNote = (v) => setData(prev=>{ const d=clone(prev); const st=d.classes[classId].students.find(s=>s.id===studentId); if(!st.termNotes) st.termNotes={}; st.termNotes[termId]=v; return d; });

  const list = student ? student.feedbacks.filter(f=>(f.termId||"")===termId).sort((a,b)=> (a.date<b.date?1:-1)) : [];
  const note = student ? ((student.termNotes||{})[termId]||"") : "";
  const curTerm = data.terms.find(t=>t.id===termId);

  return (
    <div>
      {/* 기간 선택 */}
      <div className="mb-4">
        <label className="text-xs text-muted font-bold block mb-1">기간</label>
        <select value={termId} onChange={e=>{ setTermId(e.target.value); resetForm(); }} className={inputCls}>
          {data.terms.map(t=><option key={t.id} value={t.id}>{t.label}{t.id===data.currentTermId?" (현재)":""}</option>)}
        </select>
      </div>

      {/* 학생 선택 */}
      <div className="flex flex-wrap gap-2 mb-5">
        {cls.students.map(s=>{
          const cnt = s.feedbacks.filter(f=>(f.termId||"")===termId).length;
          return (
            <button key={s.id} onClick={()=>{ setStudentId(s.id); resetForm(); }}
              className={`px-3.5 py-2 rounded-xl text-sm font-bold border transition ${studentId===s.id ? "bg-sprout text-white border-sprout" : "bg-white text-ink border-line hover:border-sprout-ring"}`}>
              {s.name}<span className="ml-1.5 text-xs opacity-70">{cnt}</span>
            </button>
          );
        })}
        {cls.students.length===0 && <p className="text-muted text-sm">[학생 관리]에서 학생을 먼저 추가해 주세요.</p>}
      </div>

      {student && (
        <>
          {/* 자연어 종합 기록 */}
          <div className="bg-white rounded-2xl border border-line shadow-soft p-5 mb-5">
            <p className="font-jua text-lg text-ink mb-1">{curTerm ? curTerm.label : ""} · 종합 기록</p>
            <p className="text-xs text-muted mb-3">학부모님께 보여줄 자연어 기록이에요. 포트폴리오처럼 이 기간의 성장·성취를 문장으로 남겨보세요.</p>
            <textarea value={note} onChange={e=>setNote(e.target.value)} rows="4"
              placeholder={`예) 이번 ${curTerm?curTerm.label:'기간'} 동안 ${student.name} 학생은 ...`}
              className={inputCls+" resize-y leading-relaxed"} />
          </div>

          {/* 개별 기록 입력 */}
          <div className="bg-white rounded-2xl border border-line shadow-soft p-5 mb-5">
            <p className="font-jua text-lg text-ink mb-4">{editId ? "개별 기록 수정" : "개별 기록 추가"}</p>
            <div className="grid sm:grid-cols-3 gap-3 mb-3">
              <div>
                <label className="text-xs text-muted font-bold">날짜</label>
                <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className={inputCls} />
              </div>
              <div>
                <label className="text-xs text-muted font-bold">항목</label>
                <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} className={inputCls}>
                  {data.categories.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs text-muted font-bold">평가</label>
                <select value={form.rating} onChange={e=>setForm({...form,rating:e.target.value})} className={inputCls}>
                  {data.ratings.map(r=><option key={r.key} value={r.key}>{r.emoji} {r.label}</option>)}
                </select>
              </div>
            </div>
            <textarea value={form.content} onChange={e=>setForm({...form,content:e.target.value})}
              rows="3" placeholder="구체적인 관찰 내용을 적어주세요." className={inputCls+" resize-y"} />
            <div className="flex gap-2 mt-3">
              <button onClick={save} className="px-5 py-2.5 rounded-xl bg-sprout text-white font-bold hover:bg-sprout-deep transition">{editId ? "수정 저장" : "추가하기"}</button>
              {editId && <button onClick={resetForm} className="px-4 py-2.5 rounded-xl bg-white border border-line text-muted font-bold hover:border-sprout-ring transition">취소</button>}
            </div>
          </div>

          {/* 개별 기록 목록 */}
          <div className="space-y-3">
            {list.length===0 && <p className="text-muted text-sm text-center py-6">이 기간에는 개별 기록이 없어요.</p>}
            {list.map(f=>{
              const rt=data.ratings.find(r=>r.key===f.rating)||{emoji:"",label:""};
              return (
                <div key={f.id} className="bg-white rounded-2xl border border-line p-4 flex gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap mb-1.5">
                      <span className="font-gaegu text-muted text-sm">{fmtKDate(f.date)}</span>
                      <Chip tone={catTone(f.category)}>{f.category}</Chip>
                      <Chip tone={ratingTone(f.rating)}>{rt.emoji} {rt.label}</Chip>
                    </div>
                    <p className="text-ink text-sm leading-relaxed">{f.content}</p>
                  </div>
                  <div className="flex flex-col gap-1.5 shrink-0">
                    <button onClick={()=>startEdit(f)} className="text-xs font-bold text-sprout-deep hover:underline">수정</button>
                    <button onClick={()=>remove(f.id)} className="text-xs font-bold text-coral hover:underline">삭제</button>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

/* ── 학생 관리 ── */
function StudentManager({ data, setData, classId }){
  const cls = data.classes[classId];
  const [name, setName] = useState("");

  const add = () => {
    if(!name.trim()) return;
    setData(prev=>{
      const d=clone(prev);
      d.classes[classId].students.push({ id:uid(), name:name.trim(), code:"", homeworkRate:100, attendanceRate:100, summary:"", feedbacks:[] });
      return d;
    });
    setName("");
  };
  const upd = (sid, field, value) => setData(prev=>{
    const d=clone(prev);
    const s=d.classes[classId].students.find(x=>x.id===sid);
    s[field] = (field==="homeworkRate"||field==="attendanceRate") ? Number(value)||0 : value;
    return d;
  });
  const remove = (sid) => {
    if(!confirm("학생을 삭제하면 피드백 기록도 함께 지워집니다. 진행할까요?")) return;
    setData(prev=>{ const d=clone(prev); d.classes[classId].students=d.classes[classId].students.filter(s=>s.id!==sid); return d; });
  };

  // 코드 자동 생성 (전체 반에서 겹치지 않는 4자리)
  const genCode = (sid) => {
    const used = new Set();
    Object.values(data.classes).forEach(c=> c.students.forEach(s=>{ if((s.code||"").trim()) used.add(s.code.trim()); }));
    let c; do { c = String(Math.floor(1000 + Math.random()*9000)); } while(used.has(c));
    upd(sid, "code", c);
  };

  return (
    <div>
      <div className="bg-white rounded-2xl border border-line p-4 mb-5 flex gap-2">
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=> e.key==="Enter" && add()}
          placeholder="학생 이름" className={inputCls} />
        <button onClick={add} className="px-5 rounded-xl bg-sprout text-white font-bold hover:bg-sprout-deep transition whitespace-nowrap">추가</button>
      </div>

      <p className="text-xs text-muted mb-3"> 학부모는 이 코드로만 본인 자녀를 조회할 수 있어요. 다른 학생의 이름·기록은 화면에 보이지 않습니다. 코드가 없는 학생은 조회가 불가능하니 꼭 지정해 주세요.</p>

      <div className="space-y-3">
        {cls.students.map(s=>(
          <div key={s.id} className="bg-white rounded-2xl border border-line p-4">
            <div className="flex items-center justify-between mb-3">
              <input value={s.name} onChange={e=>upd(s.id,"name",e.target.value)}
                className="font-jua text-lg text-ink bg-transparent border-b border-transparent hover:border-line focus:border-sprout-ring w-40" />
              <button onClick={()=>remove(s.id)} className="text-xs font-bold text-coral hover:underline">삭제</button>
            </div>
            <div className="grid sm:grid-cols-3 gap-3">
              <div>
                <label className="text-xs text-muted font-bold">열람 코드 (필수)</label>
                <div className="flex gap-1.5">
                  <input value={s.code} onChange={e=>upd(s.id,"code",e.target.value)} placeholder="예: 1234" className={inputCls} />
                  <button onClick={()=>genCode(s.id)} className="shrink-0 px-2.5 rounded-xl bg-sprout-soft text-sprout-deep text-xs font-bold hover:bg-sprout-ring transition whitespace-nowrap">자동</button>
                </div>
              </div>
              <div>
                <label className="text-xs text-muted font-bold">과제 수행률 %</label>
                <input type="number" min="0" max="100" value={s.homeworkRate} onChange={e=>upd(s.id,"homeworkRate",e.target.value)} className={inputCls} />
              </div>
              <div>
                <label className="text-xs text-muted font-bold">출석률 %</label>
                <input type="number" min="0" max="100" value={s.attendanceRate} onChange={e=>upd(s.id,"attendanceRate",e.target.value)} className={inputCls} />
              </div>
            </div>
            <div className="mt-3">
              <label className="text-xs text-muted font-bold">종합 한마디 (비워두면 최근 피드백이 표시돼요)</label>
              <textarea value={s.summary} onChange={e=>upd(s.id,"summary",e.target.value)} rows="2" className={inputCls+" resize-y"} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── 데이터 · 설정 ── */
function DataManager({ data, setData }){
  const [importText, setImportText] = useState("");
  const jsonStr = JSON.stringify(data, null, 2);

  const setField = (k,v) => setData(prev=>{ const d=clone(prev); d[k]=v; return d; });

  const download = () => {
    const blob = new Blob([jsonStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="backup.json"; a.click();
    URL.revokeObjectURL(url);
  };
  const doImport = () => {
    try{
      const parsed = JSON.parse(importText);
      if(!parsed.classes) throw new Error();
      setData(parsed);           // Firestore에 자동 저장됨
      setImportText("");
      alert("불러오기 완료! (자동 저장됨)");
    }catch(e){ alert("JSON 형식이 올바르지 않아요."); }
  };
  const onFile = (e) => {
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>setImportText(reader.result);
    reader.readAsText(file);
  };

  return (
    <div className="space-y-5">

        GitHub 커밋이나 복사는 더 이상 필요 없어요.
      </div>

      {/* 사이트 설정 */}
      <div className="bg-white rounded-2xl border border-line p-5 space-y-3">
        <p className="font-jua text-lg text-ink">사이트 설정</p>
        <div>
          <label className="text-xs text-muted font-bold">사이트 이름</label>
          <input value={data.brandName} onChange={e=>setField("brandName",e.target.value)} className={inputCls} />
        </div>
        <div>
          <label className="text-xs text-muted font-bold">한 줄 소개</label>
          <input value={data.tagline} onChange={e=>setField("tagline",e.target.value)} className={inputCls} />
        </div>
        <div>
          <label className="text-xs text-muted font-bold">관리자 비밀번호</label>
          <input value={data.adminPassword} onChange={e=>setField("adminPassword",e.target.value)} className={inputCls} />

      {/* 백업 */}
      <div className="bg-white rounded-2xl border border-line p-5">
        <p className="font-jua text-lg text-ink mb-1">백업 · 복원</p>

        <div className="flex flex-wrap gap-2 mb-3">
          <button onClick={download} className="px-4 py-2.5 rounded-xl bg-ink text-white font-bold hover:opacity-90 transition"> 백업 내려받기</button>
        </div>
        <input type="file" accept=".json" onChange={onFile} className="mb-2 text-sm block" />
        <textarea value={importText} onChange={e=>setImportText(e.target.value)} rows="3"
          placeholder="복원할 JSON을 붙여넣거나 위에서 파일을 선택하세요." className={inputCls+" font-mono text-xs resize-y"} />
        <button onClick={doImport} className="mt-2 px-4 py-2.5 rounded-xl bg-coral text-white font-bold hover:opacity-90 transition">복원 (덮어쓰기)</button>
      </div>

/* ── 기간 관리 ── */
function TermManager({ data, setData }){
  const [label, setLabel] = useState("");
  const add = () => { if(!label.trim())return; setData(prev=>{ const d=clone(prev); if(!d.terms)d.terms=[]; d.terms.push({id:uid(), label:label.trim()}); d.currentTermId=d.terms[d.terms.length-1].id; return d; }); setLabel(""); };
  const rename = (id,v) => setData(prev=>{ const d=clone(prev); const t=d.terms.find(x=>x.id===id); if(t)t.label=v; return d; });
  const setCurrent = (id) => setData(prev=>{ const d=clone(prev); d.currentTermId=id; return d; });
  const move = (id,dir) => setData(prev=>{ const d=clone(prev); const i=d.terms.findIndex(x=>x.id===id); const j=i+dir; if(j<0||j>=d.terms.length)return d; const tmp=d.terms[i]; d.terms[i]=d.terms[j]; d.terms[j]=tmp; return d; });
  const remove = (id) => {
    if(data.terms.length<=1){ alert("최소 1개의 기간은 있어야 해요."); return; }
    if(!confirm("이 기간을 삭제할까요? 이 기간의 개별 기록과 종합 기록도 함께 지워집니다.")) return;
    setData(prev=>{ const d=clone(prev);
      d.terms=d.terms.filter(t=>t.id!==id);
      Object.values(d.classes).forEach(cls=>cls.students.forEach(st=>{
        st.feedbacks=(st.feedbacks||[]).filter(f=>f.termId!==id);
        if(st.termNotes) delete st.termNotes[id];
      }));
      if(d.currentTermId===id) d.currentTermId=d.terms[d.terms.length-1].id;
      return d;
    });
  };
  return (
    <div>
      <div className="bg-white rounded-2xl border border-line p-4 mb-5 flex gap-2">
        <input value={label} onChange={e=>setLabel(e.target.value)} onKeyDown={e=> e.key==="Enter" && add()}
          placeholder="예: 2026 2학기 중간고사" className={inputCls} />
        <button onClick={add} className="px-5 rounded-xl bg-sprout text-white font-bold hover:bg-sprout-deep transition whitespace-nowrap">추가</button>
      </div>
      <p className="text-xs text-muted mb-3">'현재'로 지정한 기간에 새 기록이 기본 저장되고, 학부모 화면에서도 그 기간이 먼저 열려요. ▲▼로 순서를 바꿀 수 있어요.</p>
      <div className="space-y-2">
        {(data.terms||[]).map((t)=>(
          <div key={t.id} className="bg-white rounded-2xl border border-line p-3 flex items-center gap-2">
            <input value={t.label} onChange={e=>rename(t.id,e.target.value)} className="flex-1 bg-transparent font-bold text-ink text-sm min-w-0" />
            {data.currentTermId===t.id
              ? <Chip tone="sprout">현재</Chip>
              : <button onClick={()=>setCurrent(t.id)} className="text-xs font-bold text-sprout-deep hover:underline shrink-0">현재로</button>}
            <button onClick={()=>move(t.id,-1)} className="text-sm text-muted hover:text-ink shrink-0 px-1">▲</button>
            <button onClick={()=>move(t.id,1)} className="text-sm text-muted hover:text-ink shrink-0 px-1">▼</button>
            <button onClick={()=>remove(t.id)} className="text-xs font-bold text-coral hover:underline shrink-0">삭제</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── 관리자 패널 ── */
function AdminPanel({ data, setData, saveState }){
  const classIds = Object.keys(data.classes);
  const [classId, setClassId] = useState(classIds[0]);
  const [tab, setTab] = useState("feedback");

  const tabs = [
    ["feedback","기록 관리"],
    ["terms","기간 관리"],
    ["students","학생 관리"],
    ["notices","공지 관리"],
    ["schedule","일정 관리"],
    ["data","데이터·설정"],
  ];
  const perClass = tab==="feedback" || tab==="students" || tab==="notices" || tab==="schedule";

  const saveBadge = {
    saving: { t:"저장 중…", c:"bg-sun-soft text-[#a9781a]" },
    saved:  { t:"저장됨",   c:"bg-sprout-soft text-sprout-deep" },
    error:  { t:"저장 실패", c:"bg-coral-soft text-[#c04a34]" },
  }[saveState];

  return (
    <div className="max-w-3xl mx-auto px-4 pb-24 fade-up">
      <div className="flex flex-wrap items-center gap-2 mb-4 no-print">
        {tabs.map(([k,label])=>(
          <button key={k} onClick={()=>setTab(k)}
            className={`px-4 py-2 rounded-full text-sm font-bold border transition ${tab===k ? "bg-ink text-white border-ink" : "bg-white text-muted border-line hover:border-sprout-ring"}`}>
            {label}
          </button>
        ))}
        {saveBadge && (
          <span className={`ml-auto text-xs font-bold px-3 py-1.5 rounded-full ${saveBadge.c}`}>{saveBadge.t}</span>
        )}
      </div>

      {perClass && classIds.length>1 && (
        <div className="flex flex-wrap gap-2 mb-4">
          {classIds.map(id=>(
            <button key={id} onClick={()=>setClassId(id)}
              className={`px-3.5 py-1.5 rounded-lg text-xs font-bold border transition ${classId===id ? "bg-sprout text-white border-sprout" : "bg-white text-ink border-line"}`}>
              {data.classes[id].name}
            </button>
          ))}
        </div>
      )}

      <div className="bg-paper/40 rounded-2xl p-1">
        {tab==="feedback" && <FeedbackManager key={classId} data={data} setData={setData} classId={classId} />}
        {tab==="terms"    && <TermManager data={data} setData={setData} />}
        {tab==="students" && <StudentManager  key={classId} data={data} setData={setData} classId={classId} />}
        {tab==="notices"  && <NoticeManager   key={classId} data={data} setData={setData} classId={classId} />}
        {tab==="schedule" && <ScheduleManager key={classId} data={data} setData={setData} classId={classId} />}
        {tab==="data"     && <DataManager     data={data} setData={setData} />}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════

    <CenterWrap>
      <div className="bg-white rounded-2xl border border-line shadow-card p-7">
        <div className="text-3xl mb-2 text-center"></div>
        <h2 className="font-jua text-xl text-ink text-center mb-3">Firebase 연결이 필요해요</h2>

          index.html 위쪽의 <b>firebaseConfig</b> 부분에 Firebase 콘솔에서 복사한 설정값을 붙여넣어 주세요.
          (프로젝트 설정 → 내 앱(웹) → SDK 설정/구성)
        </p>
        <p className="text-xs text-muted mb-2">그 다음 Firestore 규칙을 아래처럼 설정하세요:</p>

      <div className="bg-white rounded-2xl border border-line shadow-card p-7 text-center">

/* ════════════════════════════════════════════════
   App (Firebase 실시간 동기화)
   ════════════════════════════════════════════════ */
function App(){
  const [data, setData]         = useState(null);
  const [status, setStatus]     = useState("init");
  const [saveState, setSaveState] = useState(null);
  const [mode, setMode]         = useState("parent");
  const [authed, setAuthed]     = useState(false);

  const dbRef       = useRef(null);
  const localJson   = useRef("");
  const saveTimer   = useRef(null);

  useEffect(()=>{
    if(!isConfigured()){ setStatus("noconfig"); return; }
    try{
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      dbRef.current = firebase.firestore();
      setStatus("connecting");
      const ref = dbRef.current.collection(DB_COLLECTION).doc(DB_DOC);
      const unsub = ref.onSnapshot(
        (snap)=>{
          if(snap.exists){
            const norm = normalize(snap.data());
            const njson = JSON.stringify(norm);
            if(njson !== localJson.current){ localJson.current = njson; setData(norm); }
            setStatus("ready");
          } else {
            setData(null); setStatus("empty");
          }
        },
        (err)=>{ console.error(err); setStatus("error"); }
      );
      return ()=> unsub();
    }catch(e){ console.error(e); setStatus("error"); }
  },[]);

  const scheduleSave = (next)=>{
    if(!dbRef.current) return;
    setSaveState("saving");
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      dbRef.current.collection(DB_COLLECTION).doc(DB_DOC).set(next)
        .then(()=> setSaveState("saved"))
        .catch((e)=>{ console.error(e); setSaveState("error"); });
    }, 600);
  };

  const updateData = (updater)=>{
    setData(prev=>{
      const next = typeof updater === "function" ? updater(prev) : updater;
      localJson.current = JSON.stringify(next);
      scheduleSave(next);
      return next;
    });
  };

  const seed = ()=>{
    const nd = normalize(initialAppData);
    localJson.current = JSON.stringify(nd);
    setData(nd); setStatus("ready"); scheduleSave(nd);
  };

  const toggleAdmin = ()=> setMode(m=> m==="admin" ? "parent" : "admin");

  if(status==="noconfig") return <SetupScreen />;
  if(status==="error")    return <ErrorScreen />;
  if(status==="init" || status==="connecting") return <LoadingScreen />;

  const headerData = data || initialAppData;

  return (
    <div className="min-h-screen">
      <Header data={headerData} mode={mode} onToggleAdmin={toggleAdmin} />

      {mode==="parent" && (
        (status==="empty" || !data) ? <ParentEmpty /> : <ParentView data={data} />
      )}

      {mode==="admin" && (
        !authed
          ? <AdminLogin password={(data && data.adminPassword) || initialAppData.adminPassword} onOk={()=>setAuthed(true)} />
          : ((status==="empty" || !data)
              ? <SeedScreen onSeed={seed} />
              : <AdminPanel data={data} setData={updateData} saveState={saveState} />)
      )}

      <footer className="text-center text-muted text-xs pb-10 pt-6 no-print">
        <p className="font-gaegu text-sm">{headerData.brandName}</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
